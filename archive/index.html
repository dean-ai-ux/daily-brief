<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brief · Archive</title>
  <meta name="description" content="Dean's daily brief: what matters this morning, and what to read, listen to and watch.">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#efeeeb" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brief">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icon-512.png">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <script>document.documentElement.classList.add('js')</script>
  <style>
    /* A bento desk of glass folders. Hover a folder and its files rise out of the top;
       click it to open the folder as a sheet of paper you can read. */
    :root {
      --desk: #efeeeb;
      --dots: rgba(20, 20, 22, 0.07);
      --paper: #ffffff;
      --paper-2: #f6f5f3;
      --ink: #141416;
      --ink-2: rgba(20, 20, 22, 0.74);
      --ink-3: rgba(20, 20, 22, 0.62);
      --hair: rgba(20, 20, 22, 0.09);
      --hair-2: rgba(20, 20, 22, 0.16);
      --solid: #141416;
      --solid-ink: #ffffff;
      --glass-a: rgba(255, 255, 255, 0.30);
      --glass-b: rgba(255, 255, 255, 0.80);
      --glass-c: rgba(252, 252, 252, 0.95);
      --back: linear-gradient(180deg, #f3f3f4 0%, #e3e3e6 100%);
      --sheet-line: rgba(24, 24, 27, 0.09);
      --rim-o: 1;
      --shadow: rgba(16, 18, 24, 0.28);
      --bar-bg: rgba(239, 238, 235, 0.86);
      --scrim: rgba(12, 12, 14, 0.32);
      --focus: #2f6bff;
      --listen-bg: #fcefe1; --listen-ink: #8a4a10;
      --watch-bg: #e8effb; --watch-ink: #24508f;
      --sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --spring: cubic-bezier(.34, 1.36, .5, 1);
      --gutter: clamp(14px, 3.5vw, 36px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #0b0b0c;
        --dots: rgba(255, 255, 255, 0.06);
        --paper: #161618;
        --paper-2: #1e1e21;
        --ink: rgba(245, 245, 247, 0.92);
        --ink-2: rgba(245, 245, 247, 0.72);
        --ink-3: rgba(245, 245, 247, 0.60);
        --hair: rgba(255, 255, 255, 0.08);
        --hair-2: rgba(255, 255, 255, 0.15);
        --solid: #f2f2f4;
        --solid-ink: #111113;
        --glass-a: rgba(20, 20, 22, 0.30);
        --glass-b: rgba(16, 16, 18, 0.80);
        --glass-c: rgba(12, 12, 14, 0.95);
        --back: linear-gradient(180deg, #2a2a2e 0%, #121214 100%);
        --sheet-line: rgba(255, 255, 255, 0.09);
        --rim-o: 0.45;
        --shadow: rgba(0, 0, 0, 0.6);
        --bar-bg: rgba(11, 11, 12, 0.86);
        --scrim: rgba(0, 0, 0, 0.6);
        --listen-bg: rgba(255, 170, 90, 0.14); --listen-ink: #f3b77f;
        --watch-bg: rgba(120, 160, 255, 0.15); --watch-ink: #a7c2ff;
        color-scheme: dark;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans); color: var(--ink); line-height: 1.45;
      background-color: var(--desk);
      background-image: radial-gradient(var(--dots) 1.1px, transparent 1.4px);
      background-size: 22px 22px;
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

    /* ---- Top bar ---- */
    .top {
      position: sticky; top: 0; z-index: 30; padding-top: env(safe-area-inset-top);
      background: var(--bar-bg); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hair);
    }
    .top-row { max-width: 1280px; margin: 0 auto; padding: 10px var(--gutter); display: flex; align-items: center; gap: 12px; min-height: 56px; }
    .brand { font-size: 16px; font-weight: 650; letter-spacing: -0.015em; }
    .top-date { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
    .spacer { flex: 1; }
    .progress { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .progress-track { width: 56px; height: 3px; border-radius: 2px; background: var(--hair-2); overflow: hidden; }
    .progress-bar { display: block; height: 100%; width: 0; background: var(--ink); transition: width .5s var(--ease); }
    .ghost { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
    .ghost:hover { background: var(--hair); }
    .ghost svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    .wrap { max-width: 1280px; margin: 0 auto; padding: 20px var(--gutter) calc(40px + env(safe-area-inset-bottom)); }
    .latest-link { display: inline-block; margin-bottom: 14px; font-size: 13px; border-bottom: 1px solid var(--hair-2); }

    /* ---- Bento ---- */
    .bento { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(96px, auto); }
    .cell { min-width: 0; }
    .cell:not(.folder) { background: var(--paper); border: 1px solid var(--hair); border-radius: 20px; padding: 16px 18px; }
    .cell-label { font-family: var(--mono); font-size: 10.5px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
    .cell-lede, .cell-stats, .cell-week, .card-lead, .card-wildcard { grid-column: span 2; }
    .folder { grid-row: span 2; min-height: 214px; }
    .card-lead { grid-row: span 5; }
    @media (max-width: 699px) {
      .bento .cell-stats { display: flex; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
      .bento .cell-stats::-webkit-scrollbar { display: none; }
      .bento .cell-stats .tile { flex: 0 0 44%; scroll-snap-align: start; }
      .card-lead { grid-row: span 6; }
      .card-lead .f-label { bottom: 24px; }
      .f-label { left: 14px; right: 14px; bottom: 13px; }
      .f-title { font-size: 15.5px; }
      .f-teaser { font-size: 13px; }
    }
    .card-wildcard { order: 10; }

    .lede { font-size: 16.5px; line-height: 1.5; text-wrap: pretty; }
    .feedback-note { margin-top: 8px; font-size: 13px; color: var(--ink-3); }
    .commute { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .commute-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    .fmt-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .fmt-btn {
      min-height: 40px; padding: 0 14px 0 11px; border-radius: 12px; display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 550; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--hair-2);
      transition: transform .3s var(--spring);
    }
    .fmt-btn:hover { transform: translateY(-1px); }
    .fmt-btn:active { transform: scale(.96); }
    .fmt-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .fmt-btn--listen { background: var(--listen-bg); color: var(--listen-ink); box-shadow: none; }
    .fmt-btn--watch { background: var(--watch-bg); color: var(--watch-ink); box-shadow: none; }
    .fmt-count { font-family: var(--mono); font-size: 11.5px; font-weight: 400; opacity: .75; }

    .cell-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0; overflow: hidden; }
    .tile { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; min-width: 0; }
    .tile + .tile { border-left: 1px solid var(--hair); }
    a.tile:hover { background: var(--paper-2); }
    .tile-label { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-value { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
    .tile-note { font-size: 12px; color: var(--ink-3); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .week-list { list-style: none; display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
    .week-list::-webkit-scrollbar { display: none; }
    .week-list li { flex: none; width: 200px; display: flex; flex-direction: column; gap: 2px; }
    .week-when { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .week-what { font-size: 13.5px; line-height: 1.38; color: var(--ink-2); }

    /* ---- Folder: back + art, files in the pocket, frosted front ----
       JS measures each folder and sets --ft (front top), --fh (front height) and --lift. */
    .folder { --ft: 120px; --fh: 120px; --lift: 60px; position: relative; isolation: isolate; min-height: 200px; }
    .f-back {
      position: absolute; inset: 0; overflow: hidden; border-radius: 22px; background: var(--back);
      transition: translate 1s var(--ease), opacity .9s var(--ease);
    }
    .f-back::before { content: ""; position: absolute; left: 16px; right: 16px; bottom: -8px; height: 50px; }
    .folder::before {
      content: ""; position: absolute; z-index: -1; left: 16px; right: 16px; bottom: -6px; height: 56px; border-radius: 40px;
      background: var(--shadow); filter: blur(20px); transition: opacity .9s var(--ease);
    }
    .f-art { position: absolute; left: 0; top: 0; display: block; max-width: none; opacity: 0; filter: blur(12px) saturate(.6);
      transition: opacity 1.1s var(--ease), filter 1.1s var(--ease), transform 1.1s var(--ease); }
    .f-art[data-ready] { opacity: 1; filter: none; }
    .f-sheen { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 26%),
                  radial-gradient(120% 80% at 80% 0%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%); }

    .f-files { position: absolute; inset: 0; z-index: 5; pointer-events: none; clip-path: inset(-400px -400px 12px -400px); }
    .sheet {
      position: absolute; left: 10%; right: 10%; top: calc(var(--ft) - 6px); height: min(calc(var(--fh) * .9), 200px);
      border-radius: 14px; overflow: hidden; pointer-events: auto; text-align: left;
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 .5px rgba(0,0,0,.12), 0 10px 24px -10px rgba(10,12,20,.35);
      transform-origin: 50% 100%;
      transform: translateY(calc(var(--d) * -7px)) rotate(calc(var(--s) * 1.2deg));
      transition: transform .7s var(--spring) calc(var(--d) * 40ms), opacity .4s var(--ease), translate .9s var(--ease);
    }
    .sheet-lines { position: absolute; left: 12px; right: 12px; top: 52px; display: flex; flex-direction: column; gap: 8px; }
    .sheet-lines i { display: block; height: 5px; border-radius: 3px; background: var(--sheet-line); }
    .sheet-lines i:nth-child(2) { width: 88%; } .sheet-lines i:nth-child(3) { width: 64%; } .sheet-lines i:nth-child(4) { width: 80%; }
    .sheet-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .8s var(--ease); }
    .sheet-art[data-ready] { opacity: 1; }
    .sheet--listen, .sheet--watch { background: #1a1a1d; }
    .sheet--listen::after, .sheet--watch::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.18) 55%, rgba(0,0,0,0) 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .sheet-head { position: absolute; left: 12px; right: 12px; top: 10px; z-index: 1; display: flex; flex-direction: column; gap: 3px; }
    .sheet-fmt { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    .sheet-name { font-size: 13px; font-weight: 600; line-height: 1.28; letter-spacing: -0.005em; color: var(--ink);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sheet--listen .sheet-fmt, .sheet--watch .sheet-fmt { color: rgba(255,255,255,.72); }
    .sheet--listen .sheet-name, .sheet--watch .sheet-name { color: #fafafa; }
    .sheet.is-done { opacity: .55; }
    .sheet.is-done .sheet-name { text-decoration: line-through; }
    .sheet.is-nope { display: none; }

    .f-front {
      position: absolute; left: 0; right: 0; bottom: 0; top: var(--ft); z-index: 10;
      background: linear-gradient(180deg, var(--glass-a) 0%, var(--glass-b) 38%, var(--glass-c) 100%);
      -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);
      border-radius: 22px; transform-origin: 50% 100%;
      transition: transform .8s var(--spring), translate 1s var(--ease), opacity 1s var(--ease);
    }
    .f-front[data-shaped] { border-radius: 0; }
    .f-rim { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; fill: none; opacity: var(--rim-o); }
    .f-hit { position: absolute; inset: 0; z-index: 1; border-radius: 0; }
    .f-hit:focus-visible { outline-offset: -4px; }
    .f-label { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 2; pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
    .f-title { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.2; }
    .f-teaser { font-size: 14px; line-height: 1.38; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .f-meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
    .f-heads { list-style: none; margin: 4px 0 2px; }
    .f-heads li { display: flex; flex-direction: column; gap: 3px; padding: 11px 0; border-top: 1px solid var(--hair); }
    .f-head-title { font-size: 16.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
    .f-head-gist { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
    .f-heads li:first-child { border-top: 0; }
    .card-lead .f-label { top: 34px; bottom: 18px; justify-content: flex-start; }
    .card-lead .f-title { font-size: 19px; }
    .card-lead .f-meta { margin-top: auto; }

    /* hover (or keyboard focus): the glass leans toward you and the files rise and fan */
    @media (hover: hover) {
      .folder:hover .f-front, .folder:focus-within .f-front { transform: perspective(900px) rotateX(-8deg); }
      .folder:hover .sheet, .folder:focus-within .sheet {
        transform: translate(calc(var(--s) * 9%), calc(-1 * var(--lift) - var(--d) * 16px)) rotate(calc(var(--s) * 3.5deg));
      }
      .folder:hover .sheet:hover {
        transform: translate(calc(var(--s) * 9%), calc(-1 * var(--lift) - var(--d) * 16px - 12px)) rotate(calc(var(--s) * 2deg));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 .5px rgba(0,0,0,.12), 0 22px 40px -14px rgba(10,12,20,.45);
        transition-delay: 0s; z-index: 9 !important;
      }
      .folder:hover { z-index: 3; }
    }
    /* touch: no hover, so the files peek a little higher */
    @media (hover: none) {
      .sheet { transform: translate(calc(var(--s) * 4%), calc(var(--lift) * -0.28 - var(--d) * 9px)) rotate(calc(var(--s) * 2deg)); }
      .folder:active .f-front { transform: perspective(900px) rotateX(-5deg); }
    }

    /* entrance: each folder assembles itself the first time it's on screen */
    .js .folder:not(.in) .f-back { translate: 0 18px; opacity: 0; }
    .js .folder:not(.in) .sheet { translate: 0 -80px; opacity: 0; }
    .js .folder:not(.in) .f-front { translate: 0 30px; opacity: 0; }
    .js .folder:not(.in)::before { opacity: 0; }
    .folder.in .f-front { transition-delay: 0s, .3s, .3s; }

    /* ---- Rows (inside an opened folder) ---- */
    .rows { list-style: none; }
    .row {
      display: grid; grid-template-columns: 24px minmax(0, 1fr) 28px; column-gap: 12px; align-items: start;
      padding: 14px 0; border-top: 1px solid var(--hair);
    }
    .row:first-child { border-top: 0; }
    .row-open { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .row-title { font-size: 17px; font-weight: 600; letter-spacing: -0.012em; line-height: 1.3; text-wrap: pretty; }
    .row-gist { font-size: 15px; line-height: 1.45; color: var(--ink-2); }
    .row-sum { font-size: 15px; line-height: 1.5; color: var(--ink-2); }
    .row-src { margin-top: 2px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-open:hover .row-title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--hair-2); }
    .row-lead .row-title { font-size: 19px; font-weight: 650; }
    .fmt {
      display: inline-block; margin-right: 8px; padding: 1px 6px; border-radius: 5px; vertical-align: 1px;
      font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
      color: var(--ink-2); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--hair);
    }
    .fmt-listen { color: var(--listen-ink); background: var(--listen-bg); box-shadow: none; }
    .fmt-watch { color: var(--watch-ink); background: var(--watch-bg); box-shadow: none; }
    .row-bucket { margin-right: 8px; }

    .act { position: relative; display: grid; place-items: center; color: var(--ink-3); }
    .act::after { content: ""; position: absolute; inset: -10px; }
    .act svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .act-done { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hair-2); color: transparent;
      transition: background .2s var(--ease), box-shadow .2s var(--ease); }
    .act-done svg { width: 14px; height: 14px; stroke-width: 2.4; }
    .act-done:hover { color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
    .act-done[aria-pressed="true"] { background: var(--solid); box-shadow: none; color: var(--solid-ink); animation: pop .35s var(--spring); }
    @keyframes pop { from { transform: scale(.8); } to { transform: scale(1); } }
    .act-nope { width: 28px; height: 28px; border-radius: 8px; opacity: .7; transition: opacity .2s var(--ease), background .2s var(--ease); }
    .act-nope svg { width: 15px; height: 15px; stroke-width: 1.8; }
    .act-nope:hover, .act-nope:focus-visible, .act-nope[aria-pressed="true"] { opacity: 1; background: var(--hair); color: var(--ink); }
    .row.is-done .row-open { opacity: .5; }
    .row.is-done .row-title { text-decoration: line-through; text-decoration-thickness: 1px; }
    .row.is-nope { padding: 9px 0; }
    .row.is-nope .row-gist, .row.is-nope .row-sum, .row.is-nope .row-src { display: none; }
    .row.is-nope .row-title { font-size: 14px; font-weight: 500; color: var(--ink-3); }
    .row.is-nope .act-done { visibility: hidden; }

    /* ---- Footer ---- */
    .foot { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
    .foot a { font-size: 13px; font-weight: 500; color: var(--ink-2); min-height: 40px; display: inline-flex; align-items: center; }
    .sync-status { flex: 1 1 260px; font-size: 12.5px; color: var(--ink-3); }
    .paper { background: var(--paper); border-radius: 18px; padding: 4px 18px; border: 1px solid var(--hair); }
    .radar { list-style: none; }
    .radar.archive li { border-top: 1px solid var(--hair); }
    .radar.archive li:first-child { border-top: 0; }
    .radar.archive a { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; padding: 13px 0; }
    .radar-when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); padding-top: 2px; }
    .radar-what { font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }

    /* ---- Tablet: 6 columns ---- */
    @media (min-width: 700px) {
      .bento { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: minmax(104px, auto); gap: 16px; }
      .cell-lede { grid-column: 1 / 5; grid-row: 1 / 3; }
      .cell-stats { grid-column: 5 / 7; grid-row: 1 / 3; grid-template-columns: 1fr; }
      .cell-stats .tile + .tile { border-left: 0; border-top: 1px solid var(--hair); }
      .cell-week { grid-column: 1 / 7; grid-row: 3; }
      .card-lead { grid-column: 1 / 5; grid-row: 4 / 8; }
      .card-markets { grid-column: 5 / 7; grid-row: 4 / 6; }
